name: Daily Question Bot

on:
  schedule:
    # Runs at 16:00 UTC (9:00 AM PST) every day
    - cron: '0 16 * * *'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # Grants the workflow permission to save history back to your repository
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install @google/generative-ai node-fetch

      - name: Run Question Script
        run: node question.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit and Push History
        run: |
          git config --global user.name "QOTD Bot"
          git config --global user.email "bot@github.com"
          
          # Updated to track both the history array and the individual current text file
          git add qotd_history.json current_qotd.txt
          
          # Only commits if a new question was actually added to history or current
          git diff-index --quiet HEAD || (git commit -m "Update QOTD history and current file [skip ci]" && git push)
      - name: Commit and Push History
        run: |
          git config --global user.name "QOTD Bot"
          git config --global user.email "bot@github.com"
          git add qotd_history.json current_qotd.txt
          git diff-index --quiet HEAD || (git commit -m "Update QOTD history and current file [skip ci]" && git push)
